[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker-diarization"
version = "1.0.0"
description = "Speaker diarization and evaluation using pyannote.audio"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0",
    "torchaudio>=2.0",
    "pandas>=1.5",
    "pyannote.audio>=3.1",
    "pyannote.database>=5.0",
    "pyannote.metrics>=3.2",
    "pyannote.pipeline>=3.0",
]

[project.optional-dependencies]
evaluate = [
    "pandas>=1.5",
    "numpy>=1.21",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "pyannote.database>=5.0",
    "pyannote.metrics>=3.2",
]

[tool.setuptools.packages.find]
include = ["speaker_diarization*"]
